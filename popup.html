<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fakenamely</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <strong>Fakenamely</strong>
    </div>
    <label class="country">
      <span>Country</span>
      <select id="country"></select>
    </label>
  </header>

  <div class="actions">
    <button id="fill" class="primary" type="button">Fill this form</button>
    <button id="new" type="button">New identity</button>
    <button id="copy-json" type="button" title="Copy the whole identity as JSON">JSON</button>
  </div>
  <p id="status" class="status" role="status"></p>

  <dl id="fields" class="fields"></dl>

  <footer>
    Fictional data: US and Canadian phones use the reserved 555-01XX range, UK phones Ofcom's drama ranges, other countries a random number in local format, so don't dial it. Email domains accept no mail; streets are invented.
    <a href="https://fakenamely.com/api" target="_blank" rel="noopener">API</a> ·
    <a href="https://fakenamely.com/methodology" target="_blank" rel="noopener">How it is generated</a> ·
    <a href="https://github.com/vinceblock99/fakenamely-chrome-extension/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
